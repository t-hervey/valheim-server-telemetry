# Review the listen address and allow rule before installing. This endpoint is
# intended only for the Grafana server or a private management network.
server {
    listen 8765;
    server_name _;

    location /valheim-map/ {
        alias /home/steam/valheim_server/BepInEx/map-export/;
        autoindex off;
        default_type application/octet-stream;

        # Replace with the Grafana server address/subnet before enabling.
        allow 127.0.0.1;
        deny all;

        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
